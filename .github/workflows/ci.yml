name: Monorepo CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# The job only reads the repository: the default token may be read/write.
permissions:
  contents: read

# A newer push to the same PR makes the older run pointless. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # A hung test would otherwise run for the six-hour default.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Do not leave the token in .git/config for the steps that follow.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint Frontend
        run: npm run lint --workspace=frontend

      # The contract in shared is what keeps client and server from drifting: a type error there must stop the merge.
      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests with Coverage
        run: npx --no-install vitest run --coverage

      # Fork and Dependabot PRs receive no secrets: skip the scan there instead of failing the job.
      - name: Check for SonarQube token
        id: sonar
        env:
          HAS_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
        run: echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Official SonarQube Scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env: 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
