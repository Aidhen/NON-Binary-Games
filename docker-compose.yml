services:
  redis:
    image: redis:alpine
    container_name: abg_redis
    ports:
      - "6379:6379"

  # Backend Node.js + Socket.io
  backend:
    image: node:20-alpine
    container_name: abg_backend
    volumes:
      - ./backend:/app
      - ./shared:/shared
    working_dir: /app
    ports:
      - "4000:4000"
    command: npm run dev
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  # Frontend Next.js
  frontend:
    image: node:20-alpine
    container_name: abg_frontend
    volumes:
      - ./frontend:/app
      - ./shared:/shared
    working_dir: /app
    ports:
      - "3000:3000"
    command: npm run dev
    environment:
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:4000
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
