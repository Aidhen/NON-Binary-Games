sonar.projectKey=NON-Binary-Games
sonar.organization=aidhen
sonar.projectName=non-binary-games

# Define boundaries for production code vs tests
sonar.sources=shared/src,backend/src,frontend/src
sonar.tests=shared/src,backend/src,frontend/src
sonar.test.inclusions=**/*.test.ts

# Aggressive exclusions to keep AST parsing fast and avoid false Code Smells
sonar.exclusions=**/*.test.ts,frontend/public/**/*,**/*.d.ts,frontend/next-env.d.ts

# Unified coverage report from Vitest workspace
sonar.javascript.lcov.reportPaths=coverage/lcov.info