sonar.projectKey=aidhen_non-binary-games
sonar.organization=aidhen
sonar.projectName=non-binary-games

# Root sources configuration
sonar.sources=shared/src,backend/src,frontend/src
sonar.tests=shared/src,backend/src,frontend/src
sonar.test.inclusions=**/*.test.ts

# Explicitly link the coverage reports generated by Vitest
sonar.javascript.lcov.reportPaths=shared/coverage/lcov.info,backend/coverage/lcov.info,frontend/coverage/lcov.info

# Ignore standard build/module directories
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**